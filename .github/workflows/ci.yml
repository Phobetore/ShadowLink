name: CI

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    name: Build and test
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # P3 spec §4: the mux endpoint was measured against an UNMODIFIED DocHub,
      # and slice 1 ships on that claim. Three questions, because each one sees
      # something the others cannot: the file's own bytes against a pinned git
      # blob id (which is also asserted by `npm test`, on both platforms, with no
      # git at all), that same id at HEAD, and the spec's own literal sentence —
      # `git diff --stat server/DocHub.js` is empty.
      - name: DocHub is untouched
        run: node server/tools/check-dochub.mjs

      # Type-checks every source AND test file, then bundles the plugin.
      - name: Build
        run: npm run build

      - name: Unit tests
        run: npm test

      # Boots the real server and converges two real Yjs clients over a socket.
      - name: End-to-end
        run: npm run test:e2e

      # Three clients, 200 random structural operations, shuffled delivery,
      # two network partitions, 20 seeds. The slow one, and the one that matters.
      - name: Structural convergence
        run: npm run test:e2e:structural
        timeout-minutes: 10
